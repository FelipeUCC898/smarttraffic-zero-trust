server.port: ${QUERY_CLIENT_PORT:8092}
spring:
  application.name: query-client
  profiles.active: ${SPRING_PROFILES_ACTIVE:local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    ssl.enabled: ${RABBITMQ_SSL_ENABLED:false}
    ssl.validate-server-certificate: ${RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE:true}
    ssl.verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    ssl.trust-store: ${RABBITMQ_TRUSTSTORE:}
    ssl.trust-store-password: ${RABBITMQ_TRUSTSTORE_PASSWORD:}
    ssl.trust-store-type: ${RABBITMQ_TRUSTSTORE_TYPE:PKCS12}
traffic.auth:
  token-endpoint: ${AUTH_TOKEN_ENDPOINT:http://localhost:8080/token}
  client-id: ${AUTH_CLIENT_ID:query-client}
  client-secret: ${AUTH_CLIENT_SECRET:local-only}
  timeout-ms: ${AUTH_TIMEOUT_MS:5000}
