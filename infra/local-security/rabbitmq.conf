listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/certs/server.pem
ssl_options.certfile = /run/certs/server.pem
ssl_options.keyfile = /run/certs/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
default_vhost = /smarttraffic
auth_backends.1 = rabbit_auth_backend_oauth2
auth_oauth2.resource_server_id = smarttraffic-brokers
auth_oauth2.default_key = smarttraffic-rs256-v1
auth_oauth2.signing_keys.smarttraffic-rs256-v1 = /run/certs/jwt-public.pem
auth_oauth2.algorithms.1 = RS256
