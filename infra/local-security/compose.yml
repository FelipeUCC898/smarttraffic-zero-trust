services:
  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - "127.0.0.1:15671:5671"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ../../.tools/rabbit-security/server.pem:/run/certs/server.pem:ro
      - ../../.tools/rabbit-security/server.key:/run/certs/server.key:ro
      - ../../.tools/rabbit-security/jwt-public.pem:/run/certs/jwt-public.pem:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
