        "AUTH_JWT_ISSUER": "smarttraffic-auth",
        "AUTH_JWT_AUDIENCE": "smarttraffic-brokers",
        "TRUSTSTORE_PASSWORD": "${TRUSTSTORE_PASSWORD:?}",
        "RABBITMQ_HOST": "${DATA_HOST:?}",
        "RABBITMQ_PORT": "5671",
        "RABBITMQ_VHOST": "/smarttraffic",
        "RABBITMQ_SSL_ENABLED": "true",
        "RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE": "true",
        "RABBITMQ_SSL_VERIFY_HOSTNAME": "true",
        "RABBITMQ_TRUSTSTORE": "file:/run/secrets/truststore.p12",
        "RABBITMQ_TRUSTSTORE_PASSWORD": "${TRUSTSTORE_PASSWORD:?}",
        "RABBITMQ_TRUSTSTORE_TYPE": "PKCS12",
        "SPRING_PROFILES_ACTIVE": "secure",
        "AUTH_CLIENT_ID": "alert-dispatcher",
        "AUTH_CLIENT_SECRET": "${AUTH_CLIENT_ALERT_DISPATCHER_SECRET:?}",
        "SPRING_RABBITMQ_SSL_ENABLED": "true",
        "SPRING_RABBITMQ_SSL_TRUST_STORE": "file:/run/secrets/truststore.p12",
        "SPRING_RABBITMQ_SSL_TRUST_STORE_PASSWORD": "${TRUSTSTORE_PASSWORD:?}",
        "SPRING_RABBITMQ_SSL_TRUST_STORE_TYPE": "PKCS12",
        "QUERY_CLIENT_PORT": "8092",
        "DASHBOARD_PORT": "8081",
        "DASHBOARD_BIND_ADDRESS": "0.0.0.0"
      },
      "volumes": [
        "${SECRETS_DIR:?}/ca.pem:/run/secrets/ca.pem:ro",
        "${SECRETS_DIR:?}/truststore.p12:/run/secrets/truststore.p12:ro",
        "${SECRETS_DIR:?}/jwt-public.pem:/run/secrets/jwt-public.pem:ro"
      ],
      "mem_limit": "384m",
      "cpus": 0.75,
