server:
  port: ${AUTH_SERVER_PORT:8080}
spring:
  application:
    name: auth-server
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  clients:
    secrets:
      traffic-simulator: ${AUTH_CLIENT_TRAFFIC_SIMULATOR_SECRET:}
      processor: ${AUTH_CLIENT_PROCESSOR_SECRET:}
      traffic-archiver: ${AUTH_CLIENT_TRAFFIC_ARCHIVER_SECRET:}
      alert-dispatcher: ${AUTH_CLIENT_ALERT_DISPATCHER_SECRET:}
      query-client: ${AUTH_CLIENT_QUERY_CLIENT_SECRET:}
