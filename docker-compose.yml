services:
  auth-server:
    build:
      context: ./auth-server
    environment:
      AUTH_SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [data-net]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarttraffic}
      POSTGRES_USER: ${POSTGRES_USER:-smarttraffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [data-net]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    networks: [data-net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks: [data-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  traffic-archiver:
    build:
      context: ./traffic-archiver
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_DB: ${POSTGRES_DB:-smarttraffic}
      POSTGRES_USER: ${POSTGRES_USER:-smarttraffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ARCHIVER_GROUP: ${KAFKA_ARCHIVER_GROUP:-traffic-archiver-v1}
    networks: [data-net]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >-
      bash -c "kafka-topics --bootstrap-server kafka:9092
      --create --if-not-exists --topic raw_traffic_data
      --partitions 1 --replication-factor 1"
    networks: [data-net]

  traffic-dashboard:
    build:
      context: ./traffic-dashboard
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DASHBOARD_BIND_ADDRESS: 0.0.0.0
      DASHBOARD_PORT: 8081
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8081"
    networks: [data-net]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

networks:
  data-net:
    driver: bridge

volumes:
  postgres_data:
