# Configuración no secreta de demostración para el perfil secure-integration.
# Cambiar los escenarios fuera de Git para pruebas reales.
traffic:
  auth:
    tls:
      ca-certificate: ${AUTH_CA_CERTIFICATE}
  simulator:
    interval-ms: 30000
    sensors:
      - sensor-id: demo-sensor-north
        zone-id: north
        samples:
          - vehicle-count: 42
            average-speed-kmh: 21.0
            congestion-state: CONGESTIONADA
spring:
  kafka:
    properties:
      security.protocol: SASL_SSL
      ssl.truststore.location: ${KAFKA_TRUSTSTORE}
      ssl.truststore.type: ${KAFKA_TRUSTSTORE_TYPE:PKCS12}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD}
